[project]
name = "vllm-extraction"
version = "0.1.0"
description = "vLLM extraction stack with OpenAI-compatible API"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = ["pypdf", "reportlab", "ruff"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
