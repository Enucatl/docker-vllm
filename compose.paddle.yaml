name: paddleocr-vl

services:
  paddleocr-vlm-server:
    profiles: ["extraction"]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server@sha256:bffd525308facf5dba2f8eca44ab476704a0ae3bfdcba25f77655973e4c0a7ca
    restart: unless-stopped
    user: root
    shm_size: 4gb
    volumes:
      - ./model-cache/PaddleOCR-VL-1.6:/models/PaddleOCR-VL-1.6:ro
      - ./paddle-vllm.yaml:/config/vllm.yaml:ro
      - paddle-vllm-cache:/home/paddleocr/.cache/vllm
    command: paddleocr genai_server --model_name PaddleOCR-VL-1.6-0.9B --model_dir /models/PaddleOCR-VL-1.6 --host 0.0.0.0 --port 8080 --backend vllm --backend_config /config/vllm.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 300s

  paddleocr-vl-api:
    profiles: ["extraction"]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl@sha256:0971c409d1cab2b12aa17b76855e36ac8eb9fb1adc97dbeea15e9b09432a4a3b
    restart: unless-stopped
    user: root
    shm_size: 4gb
    volumes:
      - ./model-cache/PP-DocLayoutV3:/models/PP-DocLayoutV3:ro
      - ./paddle-pipeline.yaml:/home/paddleocr/pipeline_config_vllm.yaml:ro
    command: paddlex --serve --pipeline /home/paddleocr/pipeline_config_vllm.yaml
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 300s

  paddleocr-gateway:
    profiles: ["extraction"]
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    ports:
      - "8108:8080"
    volumes:
      - ./paddle-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      paddleocr-vl-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3

volumes:
  paddle-vllm-cache:
