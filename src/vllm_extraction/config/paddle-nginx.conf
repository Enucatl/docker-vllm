server {
    listen 8080;
    client_max_body_size 0;
    client_body_timeout 700s;
    send_timeout 700s;
    proxy_read_timeout 700s;
    proxy_send_timeout 700s;

    location = /health {
        auth_request /_vlm_health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_pass http://paddleocr-vl-api:8080/health;
    }

    location = /_vlm_health {
        internal;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_pass http://paddleocr-vlm-server:8080/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Keep these deployment details in sync with the pipeline and model configuration.
    location = /metadata {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"pipeline":"PaddleOCR-VL-1.6","model":"PaddlePaddle/PaddleOCR-VL-1.6","layout_model":"PP-DocLayoutV3"}';
    }

    location / {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://paddleocr-vl-api:8080;
    }
}
