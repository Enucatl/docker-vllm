# OpenAI-compatible model endpoints on the GPU workstation.
#
# Serves vLLM model containers (vision, text, embeddings) on fixed ports.
# Any client that speaks the OpenAI API can use these endpoints.
#
# Profiles:
#   extraction — PaddleOCR-VL parsing and BGE-m3 embeddings
#   coding     — Qwen 3.5-9B local LLM for code/text
#
# Usage:
#   docker compose --profile extraction up -d     # Start extraction stack
#   docker compose --profile coding up -d         # Start Qwen 3.5 (stop others first!)
#
# Stop:    docker compose down
#
# HuggingFace token (required for gated models like Llama):
#   echo -n "hf_..." > secrets/hf_token.txt
#   setfacl -m u:100000:r secrets/hf_token.txt
#
# Endpoints (OpenAI-compatible):
#   http://<this-host>:8102/v1  — embeddings             (BAAI/bge-m3)
#   http://<this-host>:8107/v1  — large language model   (Qwen/Qwen3.5-9B, coding profile)

services:
  # Embeddings — BAAI/bge-m3 on port 8102, multilingual.
  # Served via vLLM.
  bge:
    image: vllm/vllm-openai@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    restart: no
    ipc: host
    profiles: ["extraction"]
    ports:
      - "8102:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    secrets:
      - hf_token
    entrypoint: ["/bin/sh", "-c", "export HF_TOKEN=$(cat /run/secrets/hf_token) && exec python3 -m vllm.entrypoints.openai.api_server \"$@\"", "--"]
    command:
      - --model=BAAI/bge-m3
      - --gpu-memory-utilization=0.05
      - --trust-remote-code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Qwen 3.5 9B — Large language model on port 8107.
  # Lightweight model suitable for RTX 5090 32GB VRAM.
  qwen:
    image: vllm/vllm-openai@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    restart: no
    ipc: host
    profiles: ["coding"]
    ports:
      - "8107:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    secrets:
      - hf_token
    entrypoint: ["/bin/sh", "-c", "export HF_TOKEN=$(cat /run/secrets/hf_token) && exec python3 -m vllm.entrypoints.openai.api_server \"$@\"", "--"]
    command:
      - --model=Qwen/Qwen3.5-9B
      - --max-model-len=60000
      - --gpu-memory-utilization=0.85
      - --reasoning-parser=qwen3
      - --enable-prefix-caching
      - --trust-remote-code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  paddleocr-vlm-server:
    profiles: ["extraction"]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server@sha256:bffd525308facf5dba2f8eca44ab476704a0ae3bfdcba25f77655973e4c0a7ca
    restart: unless-stopped
    user: root
    shm_size: 4gb
    volumes:
      - ./model-cache/PaddleOCR-VL-1.6:/models/PaddleOCR-VL-1.6:ro
      - ./src/vllm_extraction/config/paddle-vllm.yaml:/config/vllm.yaml:ro
      - paddle-vllm-cache:/home/paddleocr/.cache/vllm
    command: paddleocr genai_server --model_name PaddleOCR-VL-1.6-0.9B --model_dir /models/PaddleOCR-VL-1.6 --host 0.0.0.0 --port 8080 --backend vllm --backend_config /config/vllm.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 300s

  paddleocr-vl-api:
    profiles: ["extraction"]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl@sha256:0971c409d1cab2b12aa17b76855e36ac8eb9fb1adc97dbeea15e9b09432a4a3b
    restart: unless-stopped
    user: root
    shm_size: 4gb
    volumes:
      - ./model-cache/PP-DocLayoutV3:/models/PP-DocLayoutV3:ro
      - ./src/vllm_extraction/config/paddle-pipeline.yaml:/home/paddleocr/pipeline_config_vllm.yaml:ro
      - ./src/vllm_extraction/paddle_archive.py:/opt/paddle_archive.py:ro
    command: bash -ec 'python /opt/paddle_archive.py && exec paddlex --serve --pipeline /home/paddleocr/pipeline_config_vllm.yaml'
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 300s

  paddleocr-gateway:
    profiles: ["extraction"]
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    ports:
      - "8108:8080"
    volumes:
      - ./src/vllm_extraction/config/paddle-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      paddleocr-vl-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3

volumes:
  hf-cache:   # shared across all model containers
  vllm-cache: # torch.compile and FlashInfer JIT cache — persisted across restarts
  paddle-vllm-cache:

secrets:
  hf_token:
    file: ../secrets/hf_token.txt
